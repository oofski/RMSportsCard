name: Deploy Inventory to GitHub Pages

# Publishes the inventory web app (inventory/public) to a `gh-pages` branch,
# which GitHub Pages then serves at a normal https:// URL. Opening it on a phone
# needs no local server, no IP typing, and no certificate warning — and the
# camera scanning works (real HTTPS = secure context).
#
# We deploy by pushing to a branch (rather than the "GitHub Actions" Pages
# environment) so it works from any source branch — the Pages "environment"
# method only allows the repo's default branch, which this isn't.
#
# The app runs fully client-side there (data is stored in the browser via
# inventory/public/store-local.js), so no backend is deployed.

on:
  push:
    branches:
      - claude/inventory-manager-qr-pnnl0q
    paths:
      - 'inventory/public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: write # needed to push the gh-pages branch

concurrency:
  group: pages-ghpages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish inventory/public to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -r inventory/public/. "$work"/
          touch "$work/.nojekyll"   # serve files as-is (skip Jekyll processing)
          cd "$work"
          git init -q
          git checkout -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy inventory app ($GITHUB_SHA)"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "Published to the gh-pages branch."
