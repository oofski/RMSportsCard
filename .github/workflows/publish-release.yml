name: Publish Release

# Publishes a GitHub Release whose downloadable asset is the installer already
# committed under dist/ (the same file the in-app auto-update feed serves).
#
# It runs automatically on a push that changes dist/ or package.json (the version
# is read from package.json), and is idempotent: it creates the vX.Y.Z release
# once and otherwise just refreshes the asset. The release is created BY the
# GitHub runner using the built-in token, which sidesteps the build environment's
# inability to push tags or dispatch workflows directly.
on:
  push:
    branches:
      - claude/pensive-brahmagupta-v0gvp5
    paths:
      - 'dist/**'
      - 'package.json'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.5.20). Blank = read from package.json.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo (includes the committed installer in dist/)
        uses: actions/checkout@v4

      - name: Create/refresh the release and attach the installer
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then VERSION="$(node -p "require('./package.json').version")"; fi
          ASSET="dist/RM-Cardz-Setup-${VERSION}.exe"
          if [ ! -f "$ASSET" ]; then
            echo "::error::Installer not found at $ASSET (is it committed for this version?)"
            exit 1
          fi
          NOTES="RM Cardz v${VERSION} — Windows installer.

          Download **RM-Cardz-Setup-${VERSION}.exe** below and run it to install or update.
          (The build is unsigned, so Windows SmartScreen may warn — choose *More info → Run anyway*.)

          See CHANGELOG.md for what changed."
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} exists — refreshing its asset + notes."
            gh release upload "v${VERSION}" "$ASSET" --clobber
            gh release edit "v${VERSION}" --title "RM Cardz v${VERSION}" --notes "$NOTES" --latest
          else
            gh release create "v${VERSION}" "$ASSET" \
              --title "RM Cardz v${VERSION}" \
              --notes "$NOTES" \
              --target "${GITHUB_SHA}" \
              --latest
          fi
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
