# electron-builder configuration
# -----------------------------------------------------------------------------
# Produces the distributable Windows installer (.exe) and wires up auto-update.
#
# Build on a Windows machine or CI runner (or Linux with wine) using:
#     npm run dist:win            # build installer locally, no publish
#     npm run dist:win:publish    # build + publish a release for auto-update
#
# On this Linux dev box (no wine) the runnable .exe is produced instead with:
#     npm run pack:win            # @electron/packager -> release/RM Cardz-win32-x64/RM Cardz.exe
#
# Auto-update uses electron-updater against GitHub Releases (see `publish`).
appId: com.rmcardz.breakmanager
productName: RM Cardz
copyright: Copyright © 2026 rm_cardz

# Only ship what the runtime needs — the renderer source and tests are excluded.
files:
  - electron/**/*
  - server/**/*
  - shared/**/*
  - renderer/dist/**/*
  - package.json
  - "!**/*.map"

directories:
  output: release
  buildResources: build

win:
  target:
    - target: nsis      # Installer .exe with auto-update support
      arch:
        - x64
    - target: portable  # Single-file portable .exe (no install needed)
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RM Cardz
  # Hyphenated literal (not ${productName}, which has a space) so the filename in
  # latest.yml matches the committed /dist file exactly under the generic feed —
  # the generic provider does NOT sanitize spaces to hyphens the way github did.
  artifactName: "RM-Cardz-Setup-${version}.${ext}"

portable:
  artifactName: "RM-Cardz-Portable-${version}.${ext}"

# Auto-update feed.
# -----------------------------------------------------------------------------
# Previously this pointed at GitHub *Releases* (provider: github), but no
# Releases are ever published from our build environment (git tag/release pushes
# are blocked) — so the updater had nothing to find and never updated.
#
# Instead we publish each release's installer + latest.yml into the repo's
# committed /dist folder and serve that folder over the GitHub "raw" CDN as a
# GENERIC feed. electron-updater fetches <url>/latest.yml, compares the version,
# downloads the matching installer from the same folder, and verifies its
# sha512. This needs no GitHub Release and no token (the repo is public).
publish:
  provider: generic
  url: https://raw.githubusercontent.com/oofski/RMSportsCard/claude/pensive-brahmagupta-v0gvp5/dist
