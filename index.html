<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="RM Cardz inventory manager — scan a QR code to check and adjust stock." />
  <!-- Make "Add to Home Screen" feel like a native app (full-screen, dark status bar). -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Inventory" />
  <title>RM Cardz — Inventory</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%233E6EB5'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>RM</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">RM</span>
      <span class="brand-name">Inventory</span>
    </div>
    <div class="header-right">
      <a href="/connect" class="connect-link" title="Connect a phone" aria-label="Connect a phone">📱</a>
      <div id="stats" class="stats"></div>
    </div>
  </header>

  <main id="app" class="app"><!-- views render here --></main>

  <nav class="tabbar">
    <a href="#/" class="tab" data-tab="/">
      <span class="tab-ico">☰</span><span class="tab-label">Items</span>
    </a>
    <a href="#/scan" class="tab" data-tab="/scan">
      <span class="tab-ico">▣</span><span class="tab-label">Scan</span>
    </a>
    <a href="#/new" class="tab" data-tab="/new">
      <span class="tab-ico">＋</span><span class="tab-label">Add</span>
    </a>
    <a href="#/labels" class="tab" data-tab="/labels">
      <span class="tab-ico">⧉</span><span class="tab-label">Labels</span>
    </a>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <!-- Vendored, MIT-licensed. See vendor/LICENSES.md -->
  <!-- ZXing: reads barcodes (UPC/EAN/Code128/…) AND QR codes from the camera. -->
  <script src="vendor/zxing.js"></script>
  <script src="vendor/qrcode.js"></script>
  <!-- Client-side data store: lets the app run with no backend (static hosting). -->
  <script src="store-local.js"></script>
  <script src="app.js"></script>
</body>
</html>
